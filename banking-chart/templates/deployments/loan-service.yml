apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.microservices.loan.replicas }}
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      containers:
      - name: loan-service
        image: {{ .Values.microservices.loan.image }}
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        ports:
        - containerPort: 3005
        envFrom:
        - configMapRef:
            name: loan-service-config
        - secretRef:
            name: loan-service-secret
        startupProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: loan-service
  ports:
  - port: 3005
    targetPort: 3005
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-service-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: mysql
  DB_USER: root
  DB_NAME: banking_db
  PORT: "3005"
---
apiVersion: v1
kind: Secret
metadata:
  name: loan-service-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_PASS: "rootpassword"


