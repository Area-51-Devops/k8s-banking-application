apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.microservices.reporting.replicas }}
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      containers:
      - name: reporting-service
        image: {{ .Values.microservices.reporting.image }}
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        ports:
        - containerPort: 3010
        envFrom:
        - configMapRef:
            name: reporting-service-config
        - secretRef:
            name: reporting-service-secret
        startupProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 5
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: reporting-service
  ports:
  - port: 3010
    targetPort: 3010
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reporting-service-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: mysql
  DB_USER: root
  DB_NAME: banking_db
  PORT: "3010"
---
apiVersion: v1
kind: Secret
metadata:
  name: reporting-service-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_PASS: "rootpassword"


