apiVersion: v1
kind: Secret
metadata:
  name: transaction-secret
  namespace: {{ .Values.namespace }}
stringData:
  DB_HOST: "mysql"
  DB_USER: "root"
  DB_PASS: "rootpassword"
  DB_NAME: "banking_db"
  REDIS_HOST: "redis"
  MQ_URL: "amqp://rabbitmq"
 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-config
  namespace: {{ .Values.namespace }}
data:
  PORT: "3003"
 
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: transaction
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.microservices.transaction.replicas }}
  selector:
    matchLabels:
      app: transaction
  template:
    metadata:
      labels:
        app: transaction
    spec:
      containers:
        - name: transaction
          image: {{ .Values.microservices.transaction.image }}
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          ports:
            - containerPort: 3003
          envFrom:
            - secretRef:
                name: transaction-secret
            - configMapRef:
                name: transaction-config
          startupProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: transaction
  ports:
    - port: 3003
      targetPort: 3003
  type: ClusterIP


