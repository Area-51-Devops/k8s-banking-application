apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.microservices.serviceDiscovery.replicas }}
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
    spec:
      containers:
        - name: service-discovery
          image: {{ .Values.microservices.serviceDiscovery.image }}
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          ports:
            - containerPort: 3009
          envFrom:
            - configMapRef:
                name: service-discovery-config
          startupProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 5
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: service-discovery
  ports:
    - port: 3009
      targetPort: 3009
  type: ClusterIP
 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-discovery-config
  namespace: {{ .Values.namespace }}
data:
  PORT: "3009"


