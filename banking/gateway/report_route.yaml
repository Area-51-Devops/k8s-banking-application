apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: report-route
  namespace: backend
spec:
  parentRefs:
  - name: banking-gateway
    namespace: gate
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/report
    backendRefs:
    - name: reporting-service
      port: 3010
