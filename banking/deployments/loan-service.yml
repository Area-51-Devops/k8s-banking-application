apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      containers:
      - name: loan-service
        image: area51devops/banking-app-loan-service:latest
        ports:
        - containerPort: 3005
        envFrom:
        - configMapRef:
            name: loan-service-config
        - secretRef:
            name: loan-service-secret
        startupProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: backend
spec:
  selector:
    app: loan-service
  ports:
  - port: 3005
    targetPort: 3005
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-service-config
  namespace: backend
data:
  DB_HOST: mysql-0.mysql.data
  DB_USER: root
  DB_NAME: banking_db
  PORT: "3005"
  MQ_URL: "amqp://rabbitmq.data"
  ACCOUNT_SVC_URL: "http://account-service:3002"

---
apiVersion: v1
kind: Secret
metadata:
  name: loan-service-secret
  namespace: backend
type: Opaque
stringData:
  DB_PASS: "rootpassword"
  JWT_SECRET: "nexus_banking_secret"
