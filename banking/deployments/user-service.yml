apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: backend
 
spec:
  type: ClusterIP
  selector:
    app: user-app
 
  ports:
    - port: 3001
      targetPort: 3001
 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: backend
data:
  DB_HOST: "mysql-0.mysql.data"
  DB_USER: "root"
  DB_NAME: "banking_db"
  REDIS_HOST: "redis.data"
  PORT: "3001"
  ACCOUNT_SVC_URL: "http://account-service:3002" 
---
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: backend
type: Opaque
stringData:
  DB_PASS: "rootpassword"
  JWT_SECRET: "nexus_banking_secret"
  JWT_EXPIRE: "8h"
 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  namespace: backend
 
spec:
  replicas: 2
 
  selector:
    matchLabels:
      app: user-app
 
  template:
    metadata:
      labels:
        app: user-app
 
    spec:
      containers:
        - name: user-container
          image: area51devops/banking-app-user-service:latest
 
          ports:
            - containerPort: 3001
 
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
