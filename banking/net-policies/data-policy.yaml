apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-policy
  namespace: data
spec:
  podSelector: {}   # applies to all pods in data namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: backend
      ports:
        - protocol: TCP
          port: 3306   # MySQL
        - protocol: TCP
          port: 6379   # Redis
        - protocol: TCP
          port: 5672   # RabbitMQ
  egress:
    # Data → Backend (response traffic back to backend services)
    - to:
        - namespaceSelector:
            matchLabels:
              name: backend

    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
