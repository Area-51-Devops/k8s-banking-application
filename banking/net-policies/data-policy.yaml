apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-policy
  namespace: data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Backend → Data (database queries, cache, message queue)
    - from:
        - namespaceSelector:
            matchLabels:
              name: backend
      ports:
        - protocol: TCP
          port: 3306   # MySQL
        - protocol: TCP
          port: 6379   # Redis
        - protocol: TCP
          port: 5672   # RabbitMQ

    # Data ↔ Data (MySQL primary-replica replication)
    - from:
        - namespaceSelector:
            matchLabels:
              name: data
      ports:
        - protocol: TCP
          port: 3306

  egress:
    # Data → Backend (response traffic back to backend services)
    - to:
        - namespaceSelector:
            matchLabels:
              name: backend

    # Data ↔ Data (MySQL replicas connecting to primary)
    - to:
        - namespaceSelector:
            matchLabels:
              name: data
      ports:
        - protocol: TCP
          port: 3306

    # DNS resolution (CoreDNS in kube-system)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
