apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: backend
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Gateway → Backend (external API traffic)
    - from:
        - namespaceSelector:
            matchLabels:
              name: gate
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3005
        - protocol: TCP
          port: 3010

    # Backend ↔ Backend (internal communication, all ports)
    - from:
        - namespaceSelector:
            matchLabels:
              name: backend

  egress:
    # Backend → Gateway (response traffic back to gateway/envoy)
    - to:
        - namespaceSelector:
            matchLabels:
              name: gate

    # Backend ↔ Backend (inter-service calls)
    - to:
        - namespaceSelector:
            matchLabels:
              name: backend

    # Backend → Data (database, cache, message queue)
    - to:
        - namespaceSelector:
            matchLabels:
              name: data
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5672

    # DNS resolution (CoreDNS in kube-system)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
