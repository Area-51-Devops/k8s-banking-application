apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate-policy
  namespace: gate
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        # ✅ Allow ALL traffic (stable for NodePort + HAProxy)
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443

  egress:
    - to:
        # ✅ Allow all egress (temporarily stabilize system)
        - ipBlock:
            cidr: 0.0.0.0/0
