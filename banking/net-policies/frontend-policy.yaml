apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: frontend
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gateway → Frontend (HTML, CSS, JS, static assets)
    - from:
        - namespaceSelector:
            matchLabels:
              name: gate
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Frontend → Gateway (response traffic back to gateway/envoy)
    - to:
        - namespaceSelector:
            matchLabels:
              name: gate

    # DNS resolution (CoreDNS in kube-system)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
